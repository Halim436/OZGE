<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | OZGE</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="checkout-container">

    <h1>Complete Your Order</h1>

    <form id="checkoutForm">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="tel" id="phone" placeholder="Phone Number" required>

        <input type="text" id="governorate" placeholder="Governorate" required>

        <input type="text" id="city" placeholder="City" required>

        <textarea id="address" placeholder="Full Address" required></textarea>

        <textarea id="notes" placeholder="Order Notes (Optional)"></textarea>

        <button type="submit">
            Confirm Order
        </button>

    </form>

</div>

<script src="js/script.js"></script>
<div id="success-message">
    ✅ Order Confirmed
</div>
</body>
</html>
